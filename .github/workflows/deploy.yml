name: Деплой

# Выкат идёт сам после каждого зелёного push в main. Секреты доступа
# (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY) лежат в окружении production,
# а не в репозитории: их видит только это задание.
#
# Ключ выката — свой, не личный ключ владельца, и в authorized_keys стоит
# с ограничением restrict: он умеет запускать rsync и больше ничего.
#
# Конфигурация стенда (deploy/) сюда не входит намеренно — её копирует
# человек, см. deploy/README.md. Выкат меняет содержимое сайта,
# а не устройство сервера.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкат на сервер
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Деплой без прохождения ворот невозможен: те же проверки, что в ci.yml.
      - run: npm run lint
      - run: npm run build
        env:
          PUBLIC_METRIKA_ID: ${{ vars.PUBLIC_METRIKA_ID }}
      - run: npm run check

      - name: Кеш движков браузеров
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify

      - name: Ключ доступа
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # --delete убирает со стенда файлы, которых больше нет в сборке,
      # иначе старые страницы остаются доступными по своим адресам.
      - name: Заливка статики
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/jw-dev.pro/dist/"

      - name: Проверка, что стенд отвечает
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://jw-dev.pro/" || echo 000)
          echo "Ответ прода: $code"
          test "$code" = "200"
