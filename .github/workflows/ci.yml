name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Ворота перед деплоем
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линтеры
        run: npm run lint

      - name: Сборка
        run: npm run build

      - name: Проверки контента и вывода
        run: npm run check

      - name: Сохранить сборку
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7
