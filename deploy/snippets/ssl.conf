# Параметры TLS. Общие для обоих блоков 443 — сайта и переезда с www.
#
# Настройки написаны здесь явно, а не подключены из options-ssl-nginx.conf
# от certbot: тот файл кладёт плагин nginx, а у нас certbot ставится
# на хост в режиме webroot и плагина не имеет. Полагаться на файл,
# которого может не оказаться, — способ уронить сборку конфига.

ssl_protocols TLSv1.2 TLSv1.3;

# Порядок шифров выбирает клиент: у современных браузеров он лучше
# отражает возможности железа, чем фиксированный список сервера.
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Билеты сессий выключены: ключ шифрования билета живёт в памяти nginx
# и не меняется до перезапуска, а это ломает прямую секретность.
ssl_session_tickets off;
