# Заголовки безопасности. Подключается в каждом server и в каждом location,
# где есть свой add_header.
#
# Почему файлом, а не строками на уровне server: в nginx свой add_header
# на уровне отменяет все унаследованные, а не дополняет их. Location
# с одним лишь Cache-Control молча остаётся без CSP — то есть без защиты
# оказывается ровно HTML, ради которого весь запрет инлайна и существует.

add_header X-Content-Type-Options     "nosniff"                         always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                     always;

# Два года и все поддомены. `preload` — заявка на список предзагрузки
# браузеров: сам по себе заголовок в него не вносит, это делается руками
# на hstspreload.org. Пока заявки нет, слово не значит ничего, но и
# не мешает: убирать его придётся только при отказе от HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# data: в img-src нужен для шумовой SVG-текстуры в CSS — она лежит
# в стилях как data-URI и по CSP относится к картинкам.
#
# mc.yandex.ru — Яндекс.Метрика: тег, пиксель и отправка событий. Три
# источника и ни одного лишнего. `frame-src` здесь нет: кадр нужен
# вебвизору, а он выключен — он пишет движение мыши и содержимое полей,
# это уже не статистика посещений.
#
# Разрешение в CSP не значит, что по адресам ходят: счётчик грузится только
# после согласия посетителя (src/scripts/consent.js), а пока переменная сборки
# PUBLIC_METRIKA_ID пуста, его нет в браузере вовсе.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru; style-src 'self'; img-src 'self' data: https://mc.yandex.ru; font-src 'self'; connect-src 'self' https://mc.yandex.ru; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
