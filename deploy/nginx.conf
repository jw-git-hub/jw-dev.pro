# Nginx для jw-dev.pro. Раздаёт статику из dist/ и проксирует форму.
#
# Главное здесь — CSP без unsafe-inline. Он работает только потому, что
# в отданном HTML нет ни одного инлайн-стиля и ни одного инлайн-скрипта;
# это стережёт проверка tests/check-inline.mjs. Если CSP начнёт ругаться
# в консоли — значит инлайн просочился, и чинить надо разметку, а не CSP.

server {
    listen 80;
    listen [::]:80;
    server_name jw-dev.pro www.jw-dev.pro;

    root /srv/site;
    index index.html;

    charset utf-8;

    # Тип манифеста: в стандартном mime.types nginx расширения .webmanifest нет,
    # и файл уехал бы как application/octet-stream — браузер такой не читает.
    types {
        application/manifest+json  webmanifest;
    }

    # --- заголовки безопасности ---------------------------------------
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                  always;

    # data: в img-src нужен для шумовой SVG-текстуры в CSS — она лежит
    # в стилях как data-URI и по CSP относится к картинкам.
    #
    # Яндекс.Метрика подключается в фазе 10. Тогда сюда добавятся ровно
    # эти источники и ничего больше:
    #   script-src  ... https://mc.yandex.ru
    #   img-src     ... https://mc.yandex.ru
    #   connect-src ... https://mc.yandex.ru
    #   frame-src       https://mc.yandex.ru      (вебвизор)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # --- сжатие --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml
               application/manifest+json;

    # --- кеширование ---------------------------------------------------
    # Ассеты Astro содержат хеш в имени: меняется содержимое — меняется имя.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML не кешируем: иначе выкаченная правка не доедет до посетителя.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # --- маршруты ------------------------------------------------------
    # Сборка в формате каталогов: /work/slug/ → /work/slug/index.html
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # --- приёмник формы ------------------------------------------------
    # Единственный динамический адрес сайта. X-Forwarded-For обязателен:
    # по нему приёмник считает лимит заявок, а без заголовка все запросы
    # приходят с адреса контейнера Nginx и лимит выключается сам собой.
    location /api/ {
        proxy_pass http://contact-api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Заявка — это несколько килобайт текста. Всё, что больше, — не заявка.
        client_max_body_size 32k;
    }

    # У русской версии своя страница 404: показывать англоязычную тому,
    # кто ходит по /ru/, — значит терять его на первой же битой ссылке.
    location ^~ /ru/ {
        try_files $uri $uri/index.html $uri/ =404;
        # Сборка в каталогах: страница лежит как /ru/404/index.html.
        error_page 404 /ru/404/index.html;
    }

    location = /ru/404/index.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Сборка в каталогах: страница лежит как /404/index.html.
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}

# HTTPS включается после покупки домена и выпуска сертификата.
# Порядок: указать A-запись на IP сервера → certbot --nginx -d jw-dev.pro -d www.jw-dev.pro
# → раскомментировать блок ниже и добавить в него все add_header из блока выше.
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name jw-dev.pro www.jw-dev.pro;
#     ssl_certificate     /etc/letsencrypt/live/jw-dev.pro/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/jw-dev.pro/privkey.pem;
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
#     ...
# }
