# Nginx для jw-dev.pro. Раздаёт статику из dist/ и проксирует форму.
#
# Главное здесь — CSP без unsafe-inline. Он работает только потому, что
# в отданном HTML нет ни одного инлайн-стиля и ни одного инлайн-скрипта;
# это стережёт проверка tests/check-inline.mjs. Если CSP начнёт ругаться
# в консоли — значит инлайн просочился, и чинить надо разметку, а не CSP.
#
# Заголовки безопасности лежат в snippets/security-headers.conf и подключаются
# отдельно в каждом location со своим add_header. Правило наследования nginx
# требует именно этого: свой add_header отменяет все унаследованные.
#
# Сертификат выпускает certbot на хосте в режиме webroot. Порядок первого
# выпуска и обновления описан в deploy/README.md.

server_tokens off;

# --- HTTP: подтверждение домена и переезд на HTTPS --------------------
server {
    listen 80;
    listen [::]:80;
    server_name jw-dev.pro www.jw-dev.pro;

    # Let's Encrypt проверяет владение доменом только по 80 порту. Certbot
    # с хоста кладёт файл-подтверждение в общий каталог, nginx отдаёт его
    # отсюда. Том смонтирован на чтение: писать в него из контейнера незачем.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Канонический адрес один — без www. Отправляем прямо на него, а не
    # на https://$host: иначе гость с www.jw-dev.pro шёл бы двумя переходами.
    location / {
        return 301 https://jw-dev.pro$request_uri;
    }
}

# --- проверка живости для docker --------------------------------------
# Отдельный слушатель, а не адрес на 80 порту. Причина измерена, а не
# предположена: `allow`/`deny` рядом с `return` не исполняются никогда.
# `return` — директива модуля rewrite, а фаза rewrite идёт раньше фазы
# access, поэтому ответ уходит до того, как запрет прочитают. Блок с
# `allow 127.0.0.1; deny all;` отдавал «ok» всему интернету, и выглядел
# при этом закрытым.
#
# Здесь запрета нет вовсе — закрывает не правило, а то, что порт 8081
# не опубликован наружу в docker-compose.yml. Изнутри контейнера, где
# и работает healthcheck, он доступен; снаружи до него нет маршрута.
# Сломать это молча правкой конфига нельзя: нужно опубликовать порт.
#
# Отвечает до редиректа: иначе healthcheck видел бы 301 и считал
# контейнер больным.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    # `default_type`, а не `add_header Content-Type`: второй не заменяет
    # тип, а добавляет второй такой же заголовок — ответ уходил с двумя
    # Content-Type сразу.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# --- HTTPS www: тот же переезд на канонический адрес ------------------
# Отдельный блок с сертификатом нужен потому, что браузер проверяет
# сертификат до того, как прочитает редирект. Без него переход
# на https://www.jw-dev.pro упирался бы в предупреждение о безопасности.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jw-dev.pro;

    ssl_certificate     /etc/letsencrypt/live/jw-dev.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jw-dev.pro/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    include /etc/nginx/snippets/security-headers.conf;

    return 301 https://jw-dev.pro$request_uri;
}

# --- HTTPS: сам сайт --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jw-dev.pro;

    ssl_certificate     /etc/letsencrypt/live/jw-dev.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jw-dev.pro/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    root /srv/site;
    index index.html;

    charset utf-8;

    include /etc/nginx/snippets/security-headers.conf;

    # --- сжатие --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml
               application/manifest+json;

    # --- кеширование ---------------------------------------------------
    # Ассеты Astro содержат хеш в имени: меняется содержимое — меняется имя.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML не кешируем: иначе выкаченная правка не доедет до посетителя.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Лента лежит как rss.xml, и по расширению уходит с типом text/xml.
    # Читалки такой примут, но правильный тип у RSS свой, и валидаторы
    # лент смотрят именно на него.
    location ~* ^/(?:ru/)?rss\.xml$ {
        include /etc/nginx/snippets/security-headers.conf;
        # `types` тут заменяет карту типов, но только внутри этого location,
        # где всё равно ровно один файл: подмена ничего больше не задевает.
        types {
            application/rss+xml  xml;
        }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Расширения .webmanifest в стандартном mime.types nginx нет, и файл уехал бы
    # как application/octet-stream — браузер такой не читает. Тип задан здесь,
    # а не блоком `types` на уровне server: `types` карту типов не дополняет,
    # а заменяет целиком. Одна строка про манифест стоила бы типов всему
    # остальному — HTML начал бы скачиваться файлом вместо того, чтобы открыться.
    location ~* \.webmanifest$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # --- маршруты ------------------------------------------------------
    # Сборка в формате каталогов: /work/slug/ → /work/slug/index.html
    #
    # Заголовки стоят здесь, а не в location по расширению .html: страницы
    # адресуются каталогами, а try_files отдаёт index.html внутри текущего
    # location и location заново не выбирает. Правило по расширению
    # не срабатывало вовсе, и HTML уходил без Cache-Control — браузер
    # кешировал его на своё усмотрение, чего мы как раз избегаем.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # --- приёмник формы ------------------------------------------------
    # Единственный динамический адрес сайта. X-Forwarded-For обязателен:
    # по нему приёмник считает лимит заявок, а без заголовка все запросы
    # приходят с адреса контейнера Nginx и лимит выключается сам собой.
    location /api/ {
        proxy_pass http://contact-api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Заявка — это несколько килобайт текста. Всё, что больше, — не заявка.
        client_max_body_size 32k;
    }

    # У русской версии своя страница 404: показывать англоязычную тому,
    # кто ходит по /ru/, — значит терять его на первой же битой ссылке.
    #
    # Префикс обычный, а не `^~`: последний отменяет разбор регулярных
    # location для всего, что начинается на /ru/, и русская половина сайта
    # оставалась без правил для картинок, манифеста и ленты — лента уходила
    # с типом text/xml, картинки без длинного кеша.
    location /ru/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ =404;
        # Сборка в каталогах: страница лежит как /ru/404/index.html.
        error_page 404 /ru/404/index.html;
    }

    location = /ru/404/index.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Английская 404 — единственная страница, которую Astro кладёт файлом,
    # а не каталогом: сервера ищут /404.html, и особый случай он оставляет
    # особым. Русская при этом лежит каталогом, как все остальные.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
