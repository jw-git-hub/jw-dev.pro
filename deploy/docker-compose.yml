# Прод-стенд jw-dev.pro.
#
# Сайт — статика: Nginx просто раздаёт содержимое dist/, собранного в CI.
# Контейнер contact-api добавится в фазе 9; он нужен только форме, потому
# что доставка заявки требует секрета (токен бота, пароль SMTP), а всё,
# что попадает в браузер, публично.

services:
  web:
    image: nginx:1.29-alpine
    container_name: jw-dev-web
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ../dist:/srv/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3
